# Configuracio de java.util.logging perque els logs de org.jboss.logging
# (proveidor "jdk") es mostrin amb un format similar al de JBoss/wildfly
# pero nomes amb l'hora (sense data) i sense el nom del thread:
#
# 08:10:09,481 INFO  [es.caib.enviafib.back.security.AuthenticationSuccessListener]  ============ Login Usuari: anadal

handlers = java.util.logging.ConsoleHandler

# Nivell arrel
.level = INFO

# ConsoleHandler
java.util.logging.ConsoleHandler.level = ALL
java.util.logging.ConsoleHandler.formatter = java.util.logging.SimpleFormatter

# Format: hora,mil.lisegons NIVELL [nom.logger]  missatge
java.util.logging.SimpleFormatter.format = %1$tH:%1$tM:%1$tS,%1$tL %4$-5s [%3$s]  %5$s%n

# Nivell del paquet propi
org.fundaciobit.pluginsib.level = INFO
